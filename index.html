<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owais Halal Bucks Weekend</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366F1'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='16' font-weight='600' fill='white' text-anchor='middle'%3EOB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">

    <!-- Desktop sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">OB</span>
        <div>
          <p class="brand-title">Bucks Weekend</p>
          <p class="brand-subtitle">Owais &middot; Sept 4&ndash;6</p>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item active" data-tab="itinerary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>Itinerary</span>
        </button>
        <button class="nav-item" data-tab="attendees" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Attendees</span>
        </button>
        <button class="nav-item" data-tab="tasks-by-day" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
          <span>Tasks by Day</span>
        </button>
        <button class="nav-item" data-tab="tasks-by-person" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>
          <span>My Tasks</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
          <span class="theme-icon">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span>Theme</span>
        </button>
      </div>
    </aside>

    <div class="main-col">
      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Itinerary</h1>
          <p id="page-subtitle">Friday 4th &ndash; Sunday 6th September</p>
        </div>
        <div class="progress-widget" title="Overall packing progress">
          <div class="progress-widget-text">
            <span id="progress-count">0 / 0</span>
            <span class="progress-widget-label">packed</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </header>

      <!-- Splitwise banner -->
      <a class="splitwise-banner" href="https://www.splitwise.com/join/zjMwWquDmVw+16j12o?v=e" target="_blank" rel="noopener">
        <span class="splitwise-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </span>
        <span class="splitwise-text">
          <strong>Track shared expenses on Splitwise</strong>
          <span>Join &lsquo;Owais Bucks&rsquo; so we can split costs fairly at the end</span>
        </span>
        <span class="splitwise-cta">Join group
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </span>
      </a>

      <!-- Mobile tab bar -->
      <nav class="tabs-mobile" aria-label="Primary">
        <button class="tab-btn active" data-tab="itinerary" type="button">Itinerary</button>
        <button class="tab-btn" data-tab="attendees" type="button">Attendees</button>
        <button class="tab-btn" data-tab="tasks-by-day" type="button">Tasks by Day</button>
        <button class="tab-btn" data-tab="tasks-by-person" type="button">My Tasks</button>
      </nav>

      <main>
        <section id="itinerary" class="tab-panel active"></section>
        <section id="attendees" class="tab-panel"></section>
        <section id="tasks-by-day" class="tab-panel"></section>
        <section id="tasks-by-person" class="tab-panel"></section>
      </main>

      <footer>
        <p>Let's have a good one, boys.</p>
      </footer>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
